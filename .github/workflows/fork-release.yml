name: Release

# A tag push publishes ghcr.io/<owner>/listmonk:<tag> (also :latest) and a
# GitHub release.
# Run by hand with dry_run (the default) to build and upgrade-test a tag or
# branch without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag (or, for a dry run, branch) to build
        required: true
        default: master
      dry_run:
        description: Build and test only, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.ref || github.ref_name }}

env:
  REF: ${{ inputs.ref || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}

jobs:
  test:
    uses: ./.github/workflows/fork-test.yml
    with:
      ref: ${{ inputs.ref || github.ref_name }}

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0

      # Tags stay pre-releases (-beta.N/-rc.N) until the fork chooses
      # otherwise: such builds apply pending migrations on boot, and a final
      # version would refuse to start on SGNL until --upgrade.
      - name: Check tag and find the previous release
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)\.[0-9]+-sqlite\.[0-9]+$'
          prev=$(git tag -l 'v*-sqlite.*' --sort=-v:refname --merged HEAD^ | head -1)
          [ -n "$prev" ] || { echo "::error::no release before $REF"; exit 1; }
          if [[ "$REF" =~ $re ]] && git rev-parse -q --verify "refs/tags/$REF" >/dev/null; then
            tag=$REF
          elif [ "$PUBLISH" = true ]; then
            echo "::error::$REF is not a release tag (must match $re)"; exit 1
          else
            tag=$prev-dryrun
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/listmonk
          echo "PREV=$prev" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "$tag (commit $(git rev-parse --short HEAD)), upgrading from $prev"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: &build-args |
            LISTMONK_VERSION=${{ env.TAG }}
            COMMIT=${{ env.COMMIT }}
          labels: &labels |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only the runtime stage's apk install runs emulated: the frontend is
      # built and the Go binary cross-compiled on the runner.
      - name: Build arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: listmonk-arm64:${{ env.TAG }}
          build-args: *build-args
          labels: *labels
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The previous release's published image, or, before the first
      # published one, that tag built with this Dockerfile.
      - name: Previous release image
        run: |
          if docker pull -q "$IMAGE:$PREV"; then
            echo "OLD=$IMAGE:$PREV" >> "$GITHUB_ENV"
            exit 0
          fi
          git worktree add -q --detach "$RUNNER_TEMP/prev" "$PREV"
          cp .dockerignore "$RUNNER_TEMP/prev/"
          docker buildx build --load -f Dockerfile -t "listmonk-prev:$PREV" \
            --build-arg LISTMONK_VERSION="$PREV" \
            --build-arg COMMIT="$(git rev-parse --short "$PREV")" \
            --cache-from type=gha "$RUNNER_TEMP/prev"
          echo "OLD=listmonk-prev:$PREV" >> "$GITHUB_ENV"

      - name: Upgrade test (amd64)
        run: scripts/fork-upgrade-test.sh "$OLD" "$IMAGE:$TAG"

      # Upgrades the previous release's (amd64) data with the arm64 image,
      # emulated: the SQLite file is the same on both.
      - name: Upgrade test (arm64)
        run: scripts/fork-upgrade-test.sh "$OLD" "listmonk-arm64:$TAG"

      # Rebuilds both platforms from the cache of the tested builds.
      - name: Publish image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          build-args: *build-args
          labels: *labels
          cache-from: type=gha

      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Image: \`$IMAGE:$TAG\` (also \`latest\`; linux/amd64, linux/arm64)"
            echo
            echo "Changes since $PREV:"
            echo
            git log --no-merges --format='- %s (%h)' "$PREV..HEAD"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --prerelease --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
